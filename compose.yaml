services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cockpit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}@schlosshotel-cockpit-db:5432/cockpit
      SECURE_COOKIES: ${SECURE_COOKIES:-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CONNECTOR_WORKSPACE_TAG: ${CONNECTOR_WORKSPACE_TAG:-}
      GOOGLE_BUSINESS_CLIENT_ID: ${GOOGLE_BUSINESS_CLIENT_ID:-}
      GOOGLE_BUSINESS_CLIENT_SECRET: ${GOOGLE_BUSINESS_CLIENT_SECRET:-}
      GOOGLE_BUSINESS_REFRESH_TOKEN: ${GOOGLE_BUSINESS_REFRESH_TOKEN:-}
      BOOKING_CONNECTIVITY_CLIENT_ID: ${BOOKING_CONNECTIVITY_CLIENT_ID:-}
      BOOKING_CONNECTIVITY_CLIENT_SECRET: ${BOOKING_CONNECTIVITY_CLIENT_SECRET:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      INSTAGRAM_API_VERSION: ${INSTAGRAM_API_VERSION:-}
    ports:
      - "127.0.0.1:3210:3000"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    networks:
      default:
        aliases:
          - schlosshotel-cockpit-db
    environment:
      POSTGRES_USER: cockpit
      POSTGRES_DB: cockpit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  database:
